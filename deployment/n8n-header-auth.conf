# Fragment nginx inside the HTTPS server block that fronts n8n.
# Native n8n Header Auth rejects missing/invalid tokens with 403.
# This optional pre-check gives 401 for a MISSING token, without storing its value here.
location ^~ /webhook/api/ {
    if ($http_x_drivepilot_token = "") { return 401; }
    proxy_pass http://127.0.0.1:5678;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
